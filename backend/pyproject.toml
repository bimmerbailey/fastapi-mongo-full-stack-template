[project]
name = "mongo-fullstack-template"
version = "0.1.0"
description = "Boilerplate backend for full stack app"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "beanie>=1.29.0",
    "python-jose>=3.3.0",
    # Update after 72 character bug if fixed
    "bcrypt==4.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.20",
    "asgi-correlation-id>=4.3.0",
    "structlog>=25.1.0",
    "motor>=3.6.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "faker>=35.0.0",
    "mypy>=1.14.0",
    "black>=24.10.0",
    "ruff>=0.9.0",
    "rich>=13.9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
]

[tool.mypy]
python_version = "3.13"
strict = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "development*"]
